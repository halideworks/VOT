name: fuzz-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build standalone fuzz drivers
        run: |
          cargo +1.88.0 build --manifest-path fuzz/frame_codec/Cargo.toml --locked
          cargo +1.88.0 build --manifest-path fuzz/manifest/Cargo.toml --locked

      - name: Run extended bounded fuzz smoke tests
        run: |
          set -euo pipefail
          for seed in fuzz/frame_codec/corpus/* test-vectors/wire/frame-envelope.json; do
            fuzz/frame_codec/target/debug/vot-frame-fuzz-driver --iterations 10000 < "$seed"
          done
          for seed in fuzz/manifest/corpus/* test-vectors/manifest/page.json; do
            fuzz/manifest/target/debug/vot-manifest-fuzz-driver --iterations 10000 < "$seed"
          done
