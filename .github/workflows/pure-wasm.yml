name: pure-wasm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && 'full-sweep' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pure-wasm:
    name: pure wasm (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: vot-coverage
            cargo_args: ""
          - package: vot-package
            cargo_args: ""
          - package: vot-proof-catalog
            cargo_args: ""
          - package: vot-sdk
            cargo_args: --no-default-features
          - package: vot-verified-range
            cargo_args: ""
          - package: vot-resume-core
            cargo_args: ""
          - package: vot-scheduler
            cargo_args: --no-default-features --lib
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.88.0 --profile minimal
          --target wasm32-unknown-unknown

      - name: Check pure crate
        run: >-
          cargo +1.88.0 check --package "${{ matrix.package }}"
          ${{ matrix.cargo_args }}
          --target wasm32-unknown-unknown --locked

      - name: Check SDK dependency boundary
        if: matrix.package == 'vot-sdk'
        run: |
          python3 -m unittest tools.test_sdk_dependencies
          python3 tools/check_sdk_dependencies.py

  scheduler-no-default:
    name: scheduler without file sink
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy

      - name: Validate scheduler without file sink
        run: |
          cargo +1.88.0 clippy -p vot-scheduler --no-default-features --all-targets --locked -- -D warnings
          cargo +1.88.0 test -p vot-scheduler --no-default-features --lib --locked
          if cargo +1.88.0 tree -p vot-scheduler --no-default-features --edges normal --locked | grep -q vot-platform-fs; then
            echo "vot-platform-fs enabled without the file-sink feature" >&2
            exit 1
          fi
