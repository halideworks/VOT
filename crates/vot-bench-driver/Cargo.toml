[package]
name = "vot-bench-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# The quiche backend, which carries the case over a real socket. Off by default
# because it builds BoringSSL through cmake, which costs minutes where the rest
# of this workspace costs seconds.
quiche = ["dep:vot-transport-quiche"]
# The MsQuic backend, which carries the case over a real socket. Off by default
# because it builds MsQuic's bundled C library, which costs minutes.
msquic = ["dep:vot-transport-msquic"]

[dependencies]
vot-codec = { path = "../vot-codec" }
vot-proof-blake3 = { path = "../vot-proof-blake3" }
vot-proof-sha256 = { path = "../vot-proof-sha256" }
vot-scheduler = { path = "../vot-scheduler" }
vot-transport-api = { path = "../vot-transport-api" }
vot-transport-msquic = { path = "../vot-transport-msquic", features = [
  "live",
], optional = true }
vot-transport-quiche = { path = "../vot-transport-quiche", features = [
  "live",
], optional = true }
vot-transport-sim = { path = "../vot-transport-sim" }
vot-verifier = { path = "../vot-verifier" }

[lints]
workspace = true
