[package]
name = "vot-sdk-file"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
vot-commit-model = { path = "../vot-commit-model" }
vot-sdk = { path = "../vot-sdk" }

[target.'cfg(any(unix, windows))'.dependencies]
vot-proof-blake3 = { path = "../vot-proof-blake3" }
vot-proof-sha256 = { path = "../vot-proof-sha256" }
vot-verifier = { path = "../vot-verifier" }
vot-platform-fs = { path = "../vot-platform-fs" }
vot-journal = { path = "../vot-journal" }

[target.'cfg(unix)'.dependencies]
vot-commit-posix = { path = "../vot-commit-posix" }
vot-commit-strict = { path = "../vot-commit-strict" }

[target.'cfg(windows)'.dependencies]
vot-commit-platform = { path = "../vot-commit-platform" }
vot-receipt = { path = "../vot-receipt" }
vot-scheduler = { path = "../vot-scheduler" }

[lints]
workspace = true
