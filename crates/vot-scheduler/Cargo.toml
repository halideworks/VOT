[package]
name = "vot-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["file-sink"]
file-sink = ["dep:vot-platform-fs"]

[dependencies]
blake3.workspace = true
vot-codec = { path = "../vot-codec" }
vot-coverage = { path = "../vot-coverage" }
vot-platform-fs = { path = "../vot-platform-fs", optional = true }
vot-transport-api = { path = "../vot-transport-api" }
vot-session = { path = "../vot-session" }
vot-verifier = { path = "../vot-verifier" }
vot-verified-range = { path = "../vot-verified-range" }

[dev-dependencies]
vot-proof-blake3 = { path = "../vot-proof-blake3" }
vot-proof-sha256 = { path = "../vot-proof-sha256" }
vot-transport-api = { path = "../vot-transport-api", features = ["test-util"] }
vot-transport-sim = { path = "../vot-transport-sim" }
