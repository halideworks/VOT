name: fuzz-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build standalone fuzz drivers
        run: |
          cargo +1.88.0 build --manifest-path fuzz/frame_codec/Cargo.toml --locked
          cargo +1.88.0 build --manifest-path fuzz/manifest/Cargo.toml --locked
          cargo +1.88.0 build --manifest-path fuzz/static-proof-catalog/Cargo.toml --locked

      - name: Run extended bounded fuzz smoke tests
        run: |
          set -euo pipefail
          for seed in fuzz/frame_codec/corpus/* test-vectors/wire/frame-envelope.json; do
            fuzz/frame_codec/target/debug/vot-frame-fuzz-driver \
              --iterations 10000 --corpus fuzz/frame_codec/corpus < "$seed"
          done
          for seed in fuzz/manifest/corpus/* test-vectors/manifest/page.json; do
            fuzz/manifest/target/debug/vot-manifest-fuzz-driver \
              --iterations 10000 --corpus fuzz/manifest/corpus < "$seed"
          done
          for seed in fuzz/static-proof-catalog/corpus/*; do
            fuzz/static-proof-catalog/target/debug/vot-proof-catalog-fuzz-driver \
              --iterations 10000 --corpus fuzz/static-proof-catalog/corpus < "$seed"
          done

  coverage-guided-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: frame_codec, corpus: fuzz/frame_codec/corpus }
          - { target: manifest, corpus: fuzz/manifest/corpus }
          - { target: static_proof_catalog, corpus: fuzz/static-proof-catalog/corpus }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        # Sanitizer coverage instrumentation is nightly-only, so the
        # coverage-guided gate cannot use the pinned stable toolchain.
        run: rustup toolchain install nightly-2026-07-15 --profile minimal

      - name: Restore pinned tool binaries
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tools-nightly-2026-07-15-cargo-fuzz-0.13.2

      - name: Install pinned cargo-fuzz
        run: >-
          cargo +nightly-2026-07-15 install --locked cargo-fuzz --version 0.13.2
          || cargo +nightly-2026-07-15 install --locked --force cargo-fuzz --version 0.13.2

      - name: Run coverage-guided fuzzing
        env:
          TARGET: ${{ matrix.target }}
          CORPUS: ${{ matrix.corpus }}
        run: >-
          cargo +nightly-2026-07-15 fuzz run --fuzz-dir fuzz/cargo-fuzz "$TARGET" "$CORPUS"
          -- -max_total_time=1200 -rss_limit_mb=512 -timeout=25

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/cargo-fuzz/artifacts
          if-no-files-found: ignore
