[package]
name = "vot-cargo-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
cap = "=0.1.2"
libfuzzer-sys = "=0.4.13"
vot-frame-fuzz-driver = { path = "../frame_codec" }
vot-manifest-fuzz-driver = { path = "../manifest" }
vot-proof-catalog-fuzz-driver = { path = "../static-proof-catalog" }
vot-retained-proof-store-fuzz-driver = { path = "../retained-proof-store" }

[[bin]]
name = "frame_codec"
path = "fuzz_targets/frame_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "static_proof_catalog"
path = "fuzz_targets/static_proof_catalog.rs"
test = false
doc = false
bench = false

[[bin]]
name = "retained_proof_store"
path = "fuzz_targets/retained_proof_store.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true

[workspace]
