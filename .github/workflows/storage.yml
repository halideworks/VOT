name: storage-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bare-metal:
    runs-on: [self-hosted, linux, x64, vot-storage]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Assert storage environment
        run: |
          fs_type=$(findmnt -T "$RUNNER_TEMP" -n -o FSTYPE)
          test "$fs_type" != overlay
          test "$fs_type" != tmpfs
          printf 'storage filesystem: %s\n' "$fs_type"

      - name: Test Strict backing corruption
        run: sh tools/test_strict_backing_corruption.sh

      - name: Measure Balanced overhead
        env:
          VOT_BENCH_ROOT: ${{ runner.temp }}
        run: sh tools/run_storage_benchmark.sh
