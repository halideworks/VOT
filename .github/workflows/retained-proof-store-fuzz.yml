name: retained-proof-store-fuzz

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retained-proof-store-fuzz.yml"
      - "Cargo.toml"
      - "crates/vot-manifest/**"
      - "crates/vot-object/**"
      - "crates/vot-proof-blake3/**"
      - "crates/vot-proof-catalog/**"
      - "crates/vot-proof-sha256/**"
      - "crates/vot-proof-store/**"
      - "crates/vot-verifier/**"
      - "fuzz/mutator/**"
      - "fuzz/retained-proof-store/**"
  pull_request:
    paths:
      - ".github/workflows/retained-proof-store-fuzz.yml"
      - "Cargo.toml"
      - "crates/vot-manifest/**"
      - "crates/vot-object/**"
      - "crates/vot-proof-blake3/**"
      - "crates/vot-proof-catalog/**"
      - "crates/vot-proof-sha256/**"
      - "crates/vot-proof-store/**"
      - "crates/vot-verifier/**"
      - "fuzz/mutator/**"
      - "fuzz/retained-proof-store/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bounded-fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build retained proof-store fuzz driver
        run: >-
          cargo +1.88.0 build
          --manifest-path fuzz/retained-proof-store/Cargo.toml --locked

      - name: Run bounded retained proof-store fuzz smoke test
        run: |
          set -euo pipefail
          for seed in fuzz/retained-proof-store/corpus/*; do
            fuzz/retained-proof-store/target/debug/vot-retained-proof-store-fuzz-driver \
              --iterations 256 --corpus fuzz/retained-proof-store/corpus < "$seed"
          done
