      - adr/0001-strict-readback.md
      - adr/0002-vcrc-certificate.md
      - adr/0003-proof-transport.md
      - adr/0004-rail-policy.md
    acceptance:
      - every_final_review_item_has_accept_reject_or_waive_record
      - no_undefined_budget_exhaustion_state

  - id: SPEC-002
    agent: A01
    wave: 0
    title: Freeze wire envelope and registries
    depends_on: [SPEC-001]
    deliverables:
