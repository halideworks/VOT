[package]
name = "vot-receipt"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["hmac"]
hmac = ["dep:hmac"]

[dependencies]
vot-cbor = { path = "../vot-cbor" }
vot-commit-model = { path = "../vot-commit-model" }
ed25519-dalek.workspace = true
hmac = { version = "0.13.0", optional = true }
sha2.workspace = true

[dev-dependencies]
hmac = "0.13.0"

[lints]
workspace = true
