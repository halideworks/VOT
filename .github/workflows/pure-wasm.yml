name: pure-wasm

on:
  push:
    branches: [main]
    # This workflow's only main-scoped cache is the pinned wasm-bindgen
    # binaries, keyed on a literal in this file. The crate checks themselves
    # already ran on the pull request.
    paths:
      - ".github/workflows/pure-wasm.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && 'full-sweep' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pure-wasm:
    name: pure wasm (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: vot-coverage
            cargo_args: ""
          - package: vot-package
            cargo_args: ""
          - package: vot-proof-catalog
            cargo_args: ""
          - package: vot-fec
            cargo_args: ""
          - package: vot-sdk
            cargo_args: --no-default-features
          - package: vot-wasm
            cargo_args: --no-default-features
          - package: vot-verified-range
            cargo_args: ""
          - package: vot-resume-core
            cargo_args: ""
          - package: vot-scheduler
            cargo_args: --no-default-features --lib
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --target wasm32-unknown-unknown

      - name: Check pure crate
        run: >-
          cargo +1.97.1 check --package "${{ matrix.package }}"
          ${{ matrix.cargo_args }}
          --target wasm32-unknown-unknown --locked

      - name: Check SDK dependency boundary
        if: matrix.package == 'vot-sdk'
        run: |
          python3 -m unittest tools.test_sdk_dependencies
          python3 tools/check_sdk_dependencies.py

      - name: Check WASM dependency boundary
        if: matrix.package == 'vot-wasm'
        run: |
          python3 -m unittest tools.test_wasm_dependencies
          python3 tools/check_wasm_dependencies.py

  wasm-bindings:
    name: wasm bindings (Node.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.14.0

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --target wasm32-unknown-unknown

      - name: Restore pinned WASM test runner
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tools-1.97.1-wasm-bindgen-cli-0.2.126

      - name: Install pinned WASM test runner
        run: >-
          cargo +1.97.1 install --locked wasm-bindgen-cli --version 0.2.126
          || cargo +1.97.1 install --locked --force wasm-bindgen-cli --version 0.2.126

      - name: Run WASM differential tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: >-
          cargo +1.97.1 test --package vot-wasm --test wasm
          --target wasm32-unknown-unknown --locked

      - name: Build generated Node.js bindings
        run: >-
          cargo +1.97.1 build --package vot-wasm
          --target wasm32-unknown-unknown --locked

      - name: Test generated JavaScript package
        run: |
          bindings="${{ runner.temp }}/vot-wasm-bindings"
          wasm-bindgen --target nodejs --out-dir "$bindings" \
            target/wasm32-unknown-unknown/debug/vot_wasm.wasm
          node crates/vot-wasm/tests/js-smoke.cjs "$bindings/vot_wasm.js"

  scheduler-no-default:
    name: scheduler without file sink
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy

      - name: Validate scheduler without file sink
        run: |
          cargo +1.97.1 clippy -p vot-scheduler --no-default-features --all-targets --locked -- -D warnings
          cargo +1.97.1 test -p vot-scheduler --no-default-features --lib --locked
          if cargo +1.97.1 tree -p vot-scheduler --no-default-features --edges normal --locked | grep -q vot-platform-fs; then
            echo "vot-platform-fs enabled without the file-sink feature" >&2
            exit 1
          fi
