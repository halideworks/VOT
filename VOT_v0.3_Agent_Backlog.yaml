project: VOT
baseline: v0.3
snapshot: 2026-07-31
policy:
  default_profile: shared-internet-reliable
  license:
    implementation: AGPL-3.0-only
    protocol_artifacts: Apache-2.0
    protocol_paths: [spec, test-vectors, models]
    inbound_nontrivial_contributions: CLA-required
  acceptance_evidence:
    - passing_test
    - minimal_deliberate_mutant
    - captured_mutant_failure
  experimental_features_default_off:
    - datagram-fec
    - vcrc
    - public-multi-rail
    - custom-congestion-control
    - multipath-quic
  invariants:
    - never_publish_without_required_assurance_predecessors
    - never_treat_transport_ack_as_durability
    - never_accept_stale_journal_incarnation
    - never_silently_downgrade_assurance
    - never_allocate_from_untrusted_length_without_bound
    - never_bypass_job_or_congestion_domain_caps

gates:
  W0:
    name: specification-freeze
    requires:
      - all_R1_R8_dispositions_normative
      - proof_formats_and_transport_frozen
      - assurance_state_machine_complete
      - version_extension_error_registries_testable
  W1:
    name: object-layer
    requires:
      - independent_vectors_for_both_suites
      - arbitrary_64KiB_range_verification
      - progressive_mutation_and_truncation_rejected
      - million_file_manifest_index_peak_allocation_lte_512MiB
  W2:
    name: commit-correctness
    requires:
      - tla_model_no_false_publish
      - injected_faults_zero_false_publish
      - strict_direct_read_catches_backing_corruption
      - balanced_overhead_percent_lte_5
  W3:
    name: deterministic-simulation
    requires:
      - seeded_replay
      - grease_and_unknown_frame_tests
      - parser_fuzz_no_unbounded_allocation
      - negative_control_faults_are_detected
      - rust_python_codec_differential_agrees
  W4:
    name: reliable-transfer
    requires:
      - root_verified_publication
      - bounded_receiver_staging
      - verified_state_survives_disconnect
  W5:
    name: resume-fallback
    requires:
      - checkpoint_bounded_retransmission
      - quic_to_tcp_preserves_verified_state
      - platform_receipts_state_actual_assurance
  W6:
    name: fast-path
    requires:
      - production_quic_backend_selected_by_data
      - primary_10Gbps_target_attains_95_percent_of_attainable_rate
      - cycles_per_verified_GiB_published
  W7:
    name: service-layer
    requires:
      - multi_source_liveness_with_one_honest_source
      - cross_job_quotas_enforced
      - active_cache_lease_prevents_gc
  W8:
    name: fec
    requires:
      - preregistered_tail_improvement_percent_gte_20
      - speculative_wire_overhead_percent_lte_5
      - no_receiver_overload_parity_loop
  W9:
    name: vcrc
    requires:
      - cvar95_estimator_uncertainty_reported
      - spend_down_ledger_modeled
      - strong_baselines_and_oracle_reported
      - no_deadline_certificate_overclaim

work_items:
