[workspace]
members = ["crates/vot-cbor", "crates/vot-capability", "crates/vot-codec", "crates/vot-verifier", "crates/vot-proof-store", "crates/vot-proof-store-file", "crates/vot-proof-blake3", "crates/vot-proof-sha256", "crates/vot-verified-range", "crates/vot-coverage", "crates/vot-object", "crates/vot-proof-catalog", "crates/vot-fec", "crates/vot-manifest", "crates/vot-pack", "crates/vot-package", "crates/vot-sdk", "crates/vot-sdk-file", "crates/vot-wasm", "crates/vot-commit-model", "crates/vot-journal", "crates/vot-commit-posix", "crates/vot-commit-strict", "crates/vot-object-store", "crates/vot-commit-object", "crates/vot-commit-platform", "crates/vot-platform-fs", "crates/vot-platform-net", "crates/vot-platform-proc", "crates/vot-receipt", "crates/vot-transport-api", "crates/vot-transport-framing", "crates/vot-transport-queue", "crates/vot-transport-quiche", "crates/vot-transport-sim", "crates/vot-transport-msquic", "crates/vot-transport-tcp", "crates/vot-session", "crates/vot-resume-core", "crates/vot-resume", "crates/vot-scheduler", "crates/vot-cli", "crates/vot-bench-driver", "crates/vot-log"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.88"
[workspace.dependencies]
blake3 = "1.8.5"
sha2 = "0.11.0"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
unicode-normalization = "0.1.24"
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
base64 = "=0.23.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# quiche 0.29.3 plus two changes: the ADR-0028 ack-latency loss floor, and a
# narrow TLS exporter used to implement ADR-0037 channel binding. Both live in
# the maintained fork; this pin dissolves when upstream releases equivalents.
[patch.crates-io]
quiche = { git = "https://github.com/halideworks/quiche.git", rev = "2bb421877826605514a4c21e7315b3439619c35f" }
