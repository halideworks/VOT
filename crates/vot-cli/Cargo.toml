[package]
name = "vot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# The socket-owning carrier. Off, the crate builds in seconds and the wire
# commands report the feature they need; on, the binary carries a QUIC
# endpoint, and quiche builds BoringSSL through bindgen and cmake to provide it.
wire = ["dep:vot-transport-quiche", "vot-transport-quiche/live", "dep:rcgen", "dep:base64"]

[dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
getrandom = "=0.4.3"
vot-capability = { path = "../vot-capability" }
vot-codec = { path = "../vot-codec" }
vot-manifest = { path = "../vot-manifest" }
vot-object = { path = "../vot-object" }
vot-pack = { path = "../vot-pack" }
vot-package = { path = "../vot-package" }
vot-receipt = { path = "../vot-receipt" }
vot-resume = { path = "../vot-resume" }
vot-fec = { path = "../vot-fec" }
vot-scheduler = { path = "../vot-scheduler", default-features = false, features = ["file-sink"] }
vot-session = { path = "../vot-session" }
vot-transport-api = { path = "../vot-transport-api" }
vot-verifier = { path = "../vot-verifier" }
vot-transport-quiche = { path = "../vot-transport-quiche", optional = true }
# Decodes the PEM armor around a serve certificate to hash the DER it sends.
base64 = { workspace = true, optional = true }
# A throwaway server certificate, because TLS 1.3 has no anonymous mode.
# aws_lc_rs is the backend rustls already selects workspace-wide, so this
# is not a second crypto library.
rcgen = { version = "=0.14.9", default-features = false, features = [
    "aws_lc_rs",
    "pem",
], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }

[lints]
workspace = true
