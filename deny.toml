[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# Workspace crates are unpublished; internal path/git dependencies are intentional.
# External wildcard versions remain denied.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/microsoft/msquic.git",
  # The ADR-0028 loss-floor fork; the entry leaves with the pin.
  "https://github.com/halideworks/quiche.git",
]
