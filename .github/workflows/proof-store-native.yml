name: proof-store-native

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/proof-store-native.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/vot-commit-model/**"
      - "crates/vot-commit-platform/**"
      - "crates/vot-commit-posix/**"
      - "crates/vot-commit-strict/**"
      - "crates/vot-journal/**"
      - "crates/vot-manifest/**"
      - "crates/vot-object/**"
      - "crates/vot-proof-blake3/**"
      - "crates/vot-proof-catalog/**"
      - "crates/vot-proof-sha256/**"
      - "crates/vot-proof-store/**"
      - "crates/vot-proof-store-file/**"
      - "crates/vot-platform-fs/**"
      - "crates/vot-receipt/**"
      - "crates/vot-scheduler/**"
      - "crates/vot-sdk/**"
      - "crates/vot-sdk-file/**"
      - "crates/vot-verifier/**"
  pull_request:
    paths:
      - ".github/workflows/proof-store-native.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/vot-commit-model/**"
      - "crates/vot-commit-platform/**"
      - "crates/vot-commit-posix/**"
      - "crates/vot-commit-strict/**"
      - "crates/vot-journal/**"
      - "crates/vot-manifest/**"
      - "crates/vot-object/**"
      - "crates/vot-proof-blake3/**"
      - "crates/vot-proof-catalog/**"
      - "crates/vot-proof-sha256/**"
      - "crates/vot-proof-store/**"
      - "crates/vot-proof-store-file/**"
      - "crates/vot-platform-fs/**"
      - "crates/vot-receipt/**"
      - "crates/vot-scheduler/**"
      - "crates/vot-sdk/**"
      - "crates/vot-sdk-file/**"
      - "crates/vot-verifier/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy

      - name: Check Windows storage lints
        if: runner.os == 'Windows'
        run: cargo +1.97.1 clippy -p vot-platform-fs -p vot-journal -p vot-sdk-file --all-targets --locked -- -D warnings

      - name: Test native storage adapters
        run: cargo +1.97.1 test -p vot-proof-store-file -p vot-sdk-file -p vot-journal --locked --no-fail-fast

      - name: Test strict unsupported path
        if: runner.os == 'macOS'
        run: cargo +1.97.1 test -p vot-commit-strict --locked

      - name: Test Windows platform file handles
        if: runner.os == 'Windows'
        run: cargo +1.97.1 test -p vot-platform-fs --locked

      - name: Exercise bounded Windows capture at 128 MiB
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo +1.97.1 build --release --locked -p vot-sdk-file --example capture_memory
          if ($LASTEXITCODE -ne 0) { throw "capture example build failed" }
          $captureRoot = Join-Path $env:RUNNER_TEMP "vot-native-capture"
          $captureExample = ".\target\release\examples\capture_memory.exe"
          try {
            $prepare = Measure-Command {
              & $captureExample prepare $captureRoot 2048 | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "capture preparation failed" }
            }
            $recover = Measure-Command {
              & $captureExample recover $captureRoot | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "capture recovery failed" }
            }
            & $captureExample compact $captureRoot | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "capture compaction failed" }
            $compacted = Measure-Command {
              & $captureExample recover $captureRoot | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "compacted recovery failed" }
            }
            @{
              payload_bytes = 134217728
              prepare_seconds = $prepare.TotalSeconds
              recover_seconds = $recover.TotalSeconds
              compacted_recover_seconds = $compacted.TotalSeconds
            } | ConvertTo-Json
          } finally {
            if (Test-Path $captureRoot) { Remove-Item -Recurse -Force $captureRoot }
          }
