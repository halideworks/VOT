[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# Workspace members intentionally use path dependencies; keep external wildcard use visible without rejecting these internal edges.
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/microsoft/msquic.git"]
