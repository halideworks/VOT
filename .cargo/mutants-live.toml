# Mutation configuration for the assembled live transports, MsQuic and quiche.
#
# The same settings as `.cargo/mutants.toml` without its exclusions of the
# live modules, because this one is run with `--features live` and those
# modules are the point. Kept as a second file because a configuration cannot
# exclude conditionally.
#
# Run it as the msquic-mutation and quiche-mutation jobs do:
#
#     cargo mutants --package vot-transport-msquic --features live \
#         --config .cargo/mutants-live.toml --timeout 120
#     cargo mutants --package vot-transport-quiche --features live \
#         --config .cargo/mutants-live.toml --timeout 120
#
# The count is deliberately not recorded here. A number beside an exclusion is
# what went stale last time; the job runs the measurement instead. What survives
# and why is written up in
# `test-vectors/mutants/the_live_transport_is_mutation_tested.md`. The job is
# advisory until those are killed or classified there; promote it then.
gitignore = true
minimum_test_timeout = 60.0
timeout_multiplier = 4.0
# The platform-gated fallbacks from `.cargo/mutants.toml`, excluded here for
# the same reason: code compiled out on this runner's OS builds and passes
# trivially when mutated, which reads as missed. `live::` is deliberately not
# repeated; measuring it is this configuration's purpose.
exclude_re = ["(windows|unsupported)_rename_noreplace", "NativeOperations.*sync_(file|parent)", "atomic_replace_windows", "same_file_regular_(windows|unsupported)", "allow_unordered_writes_windows", "refuse_fragmentation_(macos|windows)", "size_buffers_windows", "peak_resident_bytes_(macos|windows)", "write_all_at_(windows|unsupported)", "read_some_at_windows", "write_some_at_windows", "read_exact_at_unsupported", "VerifiedRange::is_empty", "remove_lock_file_other"]
exclude_globs = [
  # This configuration is run with a feature on, so the file holding what
  # the wire commands answer without it compiles nowhere here.
  "crates/vot-cli/src/nowire.rs",
  # The rendezvous protocol is `cfg(any(test, feature = "wire"))`, so the
  # default `mutation (vot-cli)` job compiles and mutates every line of it
  # already, and running it here again measures the same code twice at
  # about a minute a mutant. Anything added to that module that needs the
  # `wire` feature to compile would be measured nowhere: put such code in
  # `wire.rs`, which this configuration does measure.
  "crates/vot-cli/src/rendezvous.rs",
  # The relay module is `cfg(any(test, feature = "wire"))` for the same
  # reason and is measured in the same place, so it is excluded here for the
  # same reason. Code in it that needs the feature to compile belongs in
  # `wire.rs`.
  "crates/vot-cli/src/relay.rs",
  "crates/vot-cli/src/main.rs",
  "crates/vot-bench-driver/src/main.rs",
  "crates/vot-capability/src/bin/*",
]
