gitignore = true
# Raised from 20s after `mutation (vot-resume)` timed out in CI on a mutant the
# same run catches locally: `replace <= with > in UnitRanges::insert` makes an
# insertion do more work, and 20s is tight on a loaded runner. The timeout only
# costs anything for a mutant that genuinely hangs, and one had never done so
# before this, so the headroom is close to free.
minimum_test_timeout = 60.0
timeout_multiplier = 4.0
# The msquic live module only compiles under the `live` feature, which this
# configuration does not enable, so every mutant in it would be unviable here.
# `.cargo/mutants-live.toml` is the same configuration without that exclusion,
# and the msquic-mutation job runs it with the feature on.
exclude_re = ["live::","(windows|unsupported)_rename_noreplace", "NativeOperations.*sync_(file|parent)", "atomic_replace_windows", "same_file_regular_(windows|unsupported)", "allow_unordered_writes_windows", "refuse_fragmentation_(macos|windows)", "size_buffers_windows", "peak_resident_bytes_(macos|windows)", "write_all_at_(windows|unsupported)", "read_some_at_windows", "write_some_at_windows", "read_exact_at_unsupported", "VerifiedRange::is_empty", "remove_lock_file_other"]
# Binaries whose correctness a different check establishes. vot-capability's
# oracle exists to be compared against an independent Python implementation of
# spec/capability.cddl, which validate_capability_vectors.py does on every run and
# cargo-mutants does not; its vector writer produces the committed file that
# comparison reads. Mutating either measures the wrong thing.
#
# vot-commit-model's transition writer is the same case. It prints what
# `transition_corpus` returns, and validate_commit_transitions.py checks every
# row of that against an independent relation. The corpus itself is in lib.rs
# where this gate measures it; the printing is not what either check is about.
#
# The quiche pump is a file rather than an inline module, and the `live::`
# expression above only matches what cargo-mutants prints with that prefix, which
# a free function inside the module is not. The file is named instead. It is
# measured where it compiles: the quiche-live job runs its tests, and a live
# mutation run belongs beside the msquic one when its survivors are classified.
#
# The bench driver's quiche carrier is the same case as the pump: it compiles
# only under a feature this configuration does not enable. It is plumbing by
# design, so that everything a run's numbers depend on stays in `lib.rs` where
# this gate measures it, and its own loopback tests run in the quiche-live job.
# The cycle counter is excluded for a different reason than the files below:
# it compiles everywhere, but whether perf_event_open grants a counter is the
# host's runtime decision, so a mutant in it flips between caught and missed
# with kernel.perf_event_paranoid. What a Measurement says from the counter's
# answer is decided by note_cycles and measure in lib.rs, which this gate
# measures on every host.
#
# vot-cli's carrier is the same case as the pump above and takes the same
# remedy: `wire.rs` compiles only under the `wire` feature, which this
# configuration does not enable, so its mutants here would be reported
# against a file the tests never build. The wire-mutation job measures it
# with the feature on. `nowire.rs`, which holds what those commands answer
# without the carrier, is what this configuration does compile, and
# `the_wire_commands_name_the_feature_they_need` holds it to account.
exclude_globs = [
  "crates/vot-bench-driver/src/cycles.rs",
  "crates/vot-cli/src/wire.rs",
  "crates/vot-cli/src/wire/**",
  "crates/vot-transport-quiche/src/live.rs",
  "crates/vot-bench-driver/src/backend_msquic.rs",
  "crates/vot-bench-driver/src/backend_quiche.rs",
  "crates/vot-bench-driver/src/role.rs",
  "crates/vot-cli/src/main.rs",
  "crates/vot-bench-driver/src/main.rs",
  "crates/vot-capability/src/bin/*",
  "crates/vot-commit-model/src/bin/*",
]
